services:
  backend:
    environment:
      BACKEND_ENV: ${BACKEND_ENV:-production}
      BACKEND_LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-https://2aeventures.com,https://www.2aeventures.com}
      BACKEND_ADMIN_TOKEN: ${BACKEND_ADMIN_TOKEN:-}
      BACKEND_DATA_DIR: /app/data

  caddy:
    environment:
      APP_HOSTS: ${APP_HOSTS:?Set APP_HOSTS in .env, for example 2aeventures.com,www.2aeventures.com}
