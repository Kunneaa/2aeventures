services:
  frontend:
    image: node:20-alpine
    container_name: 2aeventures_frontend
    working_dir: /app
    command: sh -c "npm ci && npm run build && npm run start -- -p 3000"
    env_file:
      - ./frontend/.env.local
    volumes:
      - ./frontend:/app
    expose:
      - "3000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 2aeventures_backend
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: 2aeventures_nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
